controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    steering_controller:
      type: forward_command_controller/ForwardCommandController
    wheel_controller:
      type: forward_command_controller/ForwardCommandController
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
steering_controller:
  ros__parameters:
    joints:
    - fl_steering_joint
    - fr_steering_joint
    - rl_steering_joint
    - rr_steering_joint
    interface_name: position
wheel_controller:
  ros__parameters:
    joints:
    - fl_wheel_joint
    - fr_wheel_joint
    - rl_wheel_joint
    - rr_wheel_joint
    interface_name: velocity
left_arm_controller:
  ros__parameters:
    joints:
    - left_joint1
    - left_joint2
    - left_joint3
    - left_joint4
    - left_joint5
    - left_joint6
    - left_joint7
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 3.0
right_arm_controller:
  ros__parameters:
    joints:
    - right_joint1
    - right_joint2
    - right_joint3
    - right_joint4
    - right_joint5
    - right_joint6
    - right_joint7
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 3.0
left_gripper_controller:
  ros__parameters:
    joints:
    - left_gripper_joint1
    - left_gripper_joint2
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 3.0
right_gripper_controller:
  ros__parameters:
    joints:
    - right_gripper_joint1
    - right_gripper_joint2
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 3.0
